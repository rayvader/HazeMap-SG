<!doctype html>
<!-- The night skies for the widgets, as mocked up before they were built. Option C, the moon glow, is the one built.
     The shapes are the same paths as app/src/main/res/drawable/scene_*.xml, drawn here as SVG. -->
<html lang="en"><head><meta charset="utf-8"><title>Night skies for the widgets</title>
<style>
body{margin:0;padding:12px;font:12px/1.35 system-ui,sans-serif;color:var(--text,#1a1a1a);background:var(--bg,#fff)}
.g{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;max-width:640px}
.h{font-size:11px;text-align:center;color:var(--muted,#666)}
.b{grid-column:1/-1;margin-top:10px;font-weight:600}
.b span{font-weight:400;color:var(--muted,#666)}
.t{aspect-ratio:1;border-radius:12px;overflow:hidden}
.t svg{display:block;width:100%;height:100%}
</style></head><body>
<p><b>Built: option C.</b> Today's pictures at night, then three looks for the night versions.</p>
<svg width="0" height="0" style="position:absolute"><defs>
<radialGradient id="gm"><stop offset="0" stop-color="#F6F1C7" stop-opacity=".55"/><stop offset="1" stop-color="#F6F1C7" stop-opacity="0"/></radialGradient>
<radialGradient id="gb"><stop offset="0" stop-color="#FFD54F" stop-opacity=".45"/><stop offset="1" stop-color="#FFD54F" stop-opacity="0"/></radialGradient>
</defs></svg>
<div class="g" id="g"></div>
<script>
const C='M-23,2a11,11 0 1,1 22,0a11,11 0 1,1 -22,0ZM-11,-6a14,14 0 1,1 28,0a14,14 0 1,1 -28,0ZM7,3a9,9 0 1,1 18,0a9,9 0 1,1 -18,0ZM-16,2H18A6,6 0 0 1 18,14H-16A6,6 0 0 1 -16,2Z';
const M='M49,32A18,18 0 1,0 67,56A15,15 0 0,1 49,32Z';
const cl=(x,y,s,f)=>`<path d="${C}" transform="translate(${x} ${y}) scale(${s})" fill="${f}"/>`;
const mo=(x,y,s,f,o=1)=>`<path d="${M}" transform="translate(${x} ${y}) scale(${s}) translate(-50 -50)" fill="${f}" opacity="${o}"/>`;
const st=(...p)=>p.map(([x,y,r])=>`<circle cx="${x}" cy="${y}" r="${r}" fill="#fff"/>`).join('');
const dr=(c)=>[32,45,58,71].map(x=>`<path d="M${x},67l-3,8" stroke="${c}" stroke-width="3" stroke-linecap="round"/>`).join('');
const bo=()=>'<path d="M54,58L45,74H53L47,90L64,68H55L60,58Z" fill="#FFD54F"/>';
const ba=(c,o)=>`<path d="M20,58H86a3,3 0 0 1 0,6H20a3,3 0 0 1 0,-6ZM22,70H78a3,3 0 0 1 0,6H22a3,3 0 0 1 0,-6ZM18,82H82a3,3 0 0 1 0,6H18a3,3 0 0 1 0,-6Z" fill="${c}" opacity="${o}"/>`;
const gu=(c)=>`<g fill="none" stroke="${c}" stroke-width="4" stroke-linecap="round"><path d="M12,40H60c10,0 10,-14 0,-14"/><path d="M18,56H76c10,0 10,14 0,14"/><path d="M10,72H50"/></g>`;
const gl=(x,y,r,id='gm')=>`<circle cx="${x}" cy="${y}" r="${r}" fill="url(#${id})"/>`;
const sun=()=>`<g transform="translate(50 40)"><circle r="21.75" fill="#FFE9A8" opacity=".4"/><path d="M20.25,0L27,0M14.32,14.32L19.09,19.09M0,20.25L0,27M-14.32,14.32L-19.09,19.09M-20.25,0L-27,0M-14.32,-14.32L-19.09,-19.09M0,-20.25L0,-27M14.32,-14.32L19.09,-19.09" stroke="#FFD866" stroke-width="3" stroke-linecap="round" fill="none"/><circle r="15" fill="#F2C46D"/></g>`;
const cc=cl(37.45,40,.85,'#D3DCE6')+cl(61.45,60,1.15,'#fff');
const rows=[
['Today at night','the same pictures as by day: a sun in the haze, bright blue wind',[
 ['#5B6E84','#A9B8C8',cc],['#5B6E84','#A9B8C8',cc],
 ['#3B4B61','#7488A0',cl(53.6,46,1.2,'#E6ECF3')+dr('#BFE3FF')],
 ['#1E2133','#4C4669',cl(53.75,44,1.25,'#AAB3C4')+dr('#C9D6FF')+bo()],
 ['#7E6A50','#C4A77C',sun()+ba('#F1E3C6',.8)],
 ['#2F6E9C','#8EC5E8',gu('#fff')]]],
['A','dark sky, same pictures; a moon takes the sun\u2019s place',[
 ['#0F1D38','#34507F',mo(37,38,1,'#F6F1C7')+cl(61.45,60,1.05,'#E9EEF6')],
 ['#1B2433','#4A5A70',cl(37.45,40,.85,'#6F7E94')+cl(61.45,60,1.15,'#AEBACB')],
 ['#141B29','#3A485C',cl(53.6,46,1.2,'#B4C0D1')+dr('#8DB6E6')],
 ['#0D0F1A','#2A2742',cl(53.75,44,1.25,'#7F889B')+dr('#9FB0E6')+bo()],
 ['#2A241C','#5C4E3A',mo(50,40,1.1,'#E6D6A6')+ba('#CDBB93',.6)],
 ['#0F2438','#2A5575',gu('#D6E4F2')]]],
['B','A plus stars and a moon wherever the sky shows; rain and storm hide them',[
 ['#0F1D38','#34507F',st([18,24,2],[84,18,1.6],[88,52,1.4],[22,78,1.5])+mo(36,36,1.1,'#F6F1C7')+cl(62,60,1.05,'#E9EEF6')],
 ['#1B2433','#4A5A70',st([16,20,1.8],[86,26,1.5])+mo(34,34,1,'#F6F1C7',.55)+cl(37.45,40,.85,'#6F7E94')+cl(61.45,60,1.15,'#AEBACB')],
 ['#141B29','#3A485C',cl(53.6,46,1.2,'#B4C0D1')+dr('#8DB6E6')],
 ['#0D0F1A','#2A2742',cl(53.75,44,1.25,'#7F889B')+dr('#9FB0E6')+bo()],
 ['#2A241C','#5C4E3A',st([16,22,1.6],[86,30,1.4])+mo(50,40,1.1,'#E6D6A6')+ba('#CDBB93',.6)],
 ['#0F2438','#2A5575',st([16,18,1.8],[82,16,1.5],[90,40,1.3])+mo(26,24,.75,'#F6F1C7')+gu('#D6E4F2')]]],
['C','B plus a soft moon glow that lights the clouds and the haze',[
 ['#0F1D38','#34507F',gl(36,36,36)+st([18,24,2],[84,18,1.6],[88,52,1.4],[22,78,1.5])+mo(36,36,1.1,'#F6F1C7')+cl(62,60,1.05,'#EEF3FB')],
 ['#1B2433','#4A5A70',gl(34,34,40)+st([16,20,1.8],[86,26,1.5])+mo(34,34,1,'#F6F1C7',.6)+cl(37.45,40,.85,'#7C8BA2')+cl(61.45,60,1.15,'#BCC8DA')],
 ['#141B29','#3A485C',gl(50,34,40)+cl(53.6,46,1.2,'#BDC8D8')+dr('#8DB6E6')],
 ['#0D0F1A','#2A2742',gl(54,70,30,'gb')+cl(53.75,44,1.25,'#7F889B')+dr('#9FB0E6')+bo()],
 ['#2A241C','#5C4E3A',gl(50,40,44)+st([16,22,1.6],[86,30,1.4])+mo(50,40,1.1,'#EFE0B0')+ba('#D6C49C',.6)],
 ['#0F2438','#2A5575',gl(26,24,30)+st([16,18,1.8],[82,16,1.5],[90,40,1.3])+mo(26,24,.75,'#F6F1C7')+gu('#DCE8F5')]]]
];
let h=['Partly cloudy','Cloudy','Rain','Thunder','Haze','Windy'].map(n=>`<div class="h">${n}</div>`).join('');
for(const [k,d,ts] of rows){
 h+=`<div class="b">${k==='A'||k==='B'||k==='C'?'Option '+k:k} <span>\u00b7 ${d}</span></div>`;
 h+=ts.map(([a,b,s])=>`<div class="t" style="background:linear-gradient(135deg,${a},${b})"><svg viewBox="0 0 100 100">${s}</svg></div>`).join('');
}
document.getElementById('g').innerHTML=h;
</script></body></html>
