<div id="wx">
<style>
#wx{--app:#00796B;--app-fg:#fff;--sea:color-mix(in srgb,var(--info,#2b7bd6) 15%,var(--bg,#fff));font:13px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--text,#1d1d1f)}
#wx *{box-sizing:border-box}
#wx button{font:inherit}
#wx .bar{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;margin:0 0 12px}
#wx .mut{color:var(--muted,#6b6b72)}
#wx .seg{display:inline-flex;border:1px solid var(--border,#d9d9de);border-radius:8px;overflow:hidden}
#wx .seg button{all:unset;cursor:pointer;padding:5px 12px;font-size:12px;background:var(--card,#fff);color:var(--card-fg,#1d1d1f)}
#wx .seg button.on,#wx .lay.on{background:var(--app);color:var(--app-fg);border-color:transparent}
#wx .row{display:flex;flex-wrap:wrap;gap:18px;justify-content:center}
#wx figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:8px}
#wx figcaption{font-size:12px;text-align:center;color:var(--muted,#6b6b72)}
#wx figcaption b{color:var(--text,#1d1d1f)}
#wx .ph{width:236px;height:488px;border:7px solid var(--border-strong,#5a5a62);border-radius:30px;overflow:hidden;position:relative;display:flex;flex-direction:column;background:var(--bg,#f7f7f8);color:var(--text,#1d1d1f)}
#wx .sb{flex:none;height:18px;display:flex;justify-content:space-between;padding:3px 14px 0;font-size:10px;background:var(--bg,#f7f7f8);color:var(--muted,#6b6b72)}
#wx .ab{flex:none;display:flex;align-items:center;gap:6px;padding:8px 12px;font-weight:600;background:var(--app);color:var(--app-fg)}
#wx .ab button{all:unset;cursor:pointer;display:grid}
#wx .scr{flex:1;min-height:0;overflow:auto;position:relative}
#wx .fill{position:absolute;inset:0;display:flex;flex-direction:column}
#wx .nav{flex:none;display:flex;border-top:1px solid var(--border,#e2e2e6);background:var(--card,#fff);color:var(--muted,#6b6b72)}
#wx .nav button{all:unset;cursor:pointer;flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 0 8px;font-size:10px}
#wx .nav button.on{color:var(--accent,#2563eb);font-weight:600}
#wx .card{margin:8px;padding:8px 10px;border-radius:12px;border:1px solid var(--border,#e2e2e6);background:var(--card,#fff);color:var(--card-fg,#1d1d1f)}
#wx .cap{font-size:10px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted,#6b6b72);margin-bottom:5px}
#wx .big{font-size:46px;font-weight:300;line-height:1}
#wx .chips{display:flex;flex-wrap:wrap;gap:4px}
#wx .chip{all:unset;font-size:10.5px;padding:2px 8px;border-radius:999px;border:1px solid var(--border,#e2e2e6);background:var(--bg-elevated,#eef0f3);color:var(--text,#1d1d1f)}
#wx button.chip{cursor:pointer}
#wx .bd{font-size:10.5px;padding:1px 7px;border-radius:999px;color:#fff;white-space:nowrap}
#wx .three{display:flex;justify-content:space-between;text-align:center;font-size:11px}
#wx .three div{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px}
#wx .day{display:flex;align-items:center;gap:8px;font-size:12px;padding:3px 0}
#wx .day span:first-child{width:30px}
#wx .day span:last-child{margin-left:auto}
#wx svg.map{display:block;width:100%;height:auto}
#wx .sea{background:var(--sea);color:var(--text,#1d1d1f)}
#wx .scrub{flex:none;display:flex;align-items:center;gap:8px;padding:7px 10px;background:var(--card,#fff);color:var(--card-fg,#1d1d1f)}
#wx .scrub input{flex:1;min-width:0;accent-color:var(--app)}
#wx .pb{all:unset;cursor:pointer;flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--app);color:var(--app-fg)}
#wx .tm{font-size:11px;font-variant-numeric:tabular-nums;width:50px;text-align:right}
#wx .lg{flex:none;display:flex;align-items:center;gap:3px;padding:0 10px 8px;font-size:9.5px;background:var(--card,#fff);color:var(--muted,#6b6b72)}
#wx .lg i{width:14px;height:6px;border-radius:2px}
#wx .badge{position:absolute;top:8px;left:8px;padding:2px 8px;border-radius:8px;font-size:11px;font-weight:600;font-variant-numeric:tabular-nums;background:var(--card,#fff);color:var(--card-fg,#1d1d1f);box-shadow:0 1px 4px rgba(0,0,0,.2)}
#wx .sheet{position:absolute;left:0;right:0;bottom:0;height:92px;overflow:hidden;cursor:pointer;border-radius:16px 16px 0 0;box-shadow:0 -3px 14px rgba(0,0,0,.2);transition:height .25s ease;background:var(--card,#fff);color:var(--card-fg,#1d1d1f)}
#wx .sheet.open{height:372px}
#wx .grab{width:36px;height:4px;border-radius:2px;margin:7px auto 6px;background:var(--border-strong,#9a9aa3)}
#wx .over{position:absolute;inset:0;display:none;flex-direction:column;background:var(--bg,#f7f7f8);color:var(--text,#1d1d1f)}
#wx .over.show{display:flex}
#wx .hero{padding:12px 14px;background:var(--app);color:var(--app-fg)}
@media (prefers-reduced-motion:reduce){#wx .sheet{transition:none}}
</style>
<div class="bar">
 <div><b>Weather app: 3 layouts</b> <span class="mut">· tap inside each phone</span></div>
 <div style="display:flex;align-items:center;gap:8px"><span class="mut" style="font-size:12px">Rain look</span><div class="seg"><button class="on" data-look="radar">Radar</button><button data-look="gauge">Gauges</button></div></div>

const RC=['#8fd0ff','#3b9cff','#1e40af','#7c3aed'];

const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
let t=24,look='radar',playing=false,last=0,acc=0;
const map=(id,o={})=>`<svg class="map${o.rain===0?'':' rmap'}" id="${id}" viewBox="${o.vb||'0 0 490 290'}"${o.full?' style="position:absolute;inset:0;width:100%;height:100%"':''} role="img" aria-label="Map of Singapore"><defs><filter id="${id}f" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="6"/></filter></defs><rect x="-500" y="-500" width="1500" height="1300" style="fill:var(--sea)"/><path d="${SG}" stroke-width="1.2" style="fill:var(--card,#fff);stroke:var(--border-strong,#9a9aa3)"/><g class="rn" filter="url(#${id}f)" opacity=".9"></g><g class="gg"></g><g class="lb"></g></svg>`;
const scrub=()=>`<div class="scrub"><button class="pb" data-play aria-label="Play past rain">${ic('play',14)}</button><input type="range" min="0" max="24" value="24" data-scrub aria-label="Time"><span class="tm" data-clock>10:45 am</span></div>`;
const legend=()=>`<div class="lg">Light${RC.map(c=>`<i style="background:${c}"></i>`).join('')}Heavy<span data-src style="margin-left:auto;white-space:nowrap">RainViewer</span></div>`;
const rainView=id=>`<div class="fill"><div class="sea" style="flex:1;position:relative;overflow:hidden">${map(id,{full:1})}<span class="badge" data-clock>10:45 am</span></div>${scrub()}${legend()}</div>`;
const nowTop=()=>`<div style="padding:12px 14px 6px"><div style="display:flex;align-items:center;gap:10px"><span class="big">31°</span><span class="mut">${ic('cloud',38)}</span></div><div style="font-weight:600;margin-top:4px">Cloudy <span class="mut" style="font-weight:400">till 12:30 pm</span></div><div class="mut" style="font-size:12px">H 34° · L 25° · showers later</div></div><div class="chips" style="padding:0 14px 4px"><span class="chip">Humid 67%</span><span class="chip">Wind SSE 7 km/h</span><span class="chip">UV 2</span></div>`;

const hazeLayer=s=>{s.querySelector('.lb').innerHTML=REG.map(([,x,y,p,m])=>`<circle cx="${x}" cy="${y}" r="28" opacity=".92" style="fill:${band(p)[1]}"/><text x="${x}" y="${y+3}" text-anchor="middle" style="fill:#fff;font:700 21px system-ui,sans-serif">${p}</text><text x="${x}" y="${y+18}" text-anchor="middle" style="fill:#fff;font:600 12px system-ui,sans-serif">PM ${m}</text>`).join('')};

document.getElementById('pA').innerHTML=`${sb}<div class="ab">${ic('pin',14)} Ang Mo Kio</div><div class="scr" data-tab="now">${nowTop()}${today()}${hazeMini()}${days()}</div><div class="scr" data-tab="rain" hidden>${rainView('mA')}</div><div class="scr" data-tab="haze" hidden><div class="sea" style="padding:6px 0">${map('hA',{rain:0})}</div>${hazeList()}</div><div class="nav"><button class="on" data-go="now">${ic('cloud',18)}Now</button><button data-go="rain">${ic('drop',18)}Rain</button><button data-go="haze">${ic('haze',18)}Haze</button></div>`;
document.getElementById('pB').innerHTML=`${sb}<div class="sea" style="flex:1;position:relative;overflow:hidden"><div class="chips" style="position:absolute;top:8px;left:8px;right:8px;z-index:2"><button class="chip lay on" data-layer="rain">Rain</button><button class="chip lay" data-layer="haze">Haze</button><button class="chip lay" data-layer="temp">Temp</button></div><div style="position:absolute;left:0;right:0;top:0;bottom:92px">${map('mB',{vb:'30 0 400 290',full:1})}</div><span class="badge" data-clock data-bx style="top:40px">10:45 am</span><div data-bx style="position:absolute;left:8px;right:8px;bottom:100px;border-radius:12px;overflow:hidden;box-shadow:0 1px 6px rgba(0,0,0,.2)">${scrub()}${legend()}</div><div class="sheet" data-sheet><div class="grab"></div><div style="display:flex;align-items:center;gap:8px;padding:0 12px"><span style="font-size:30px;font-weight:300">31°</span><div><div style="font-weight:600">Cloudy</div><div class="mut" style="font-size:11px;white-space:nowrap">Ang Mo Kio · 25–34°</div></div><span class="mut" style="margin-left:auto">${ic('up',18)}</span></div><div style="margin-top:6px">${today()}${hazeMini()}${days()}</div></div></div>`;
document.getElementById('pC').innerHTML=`${sb}<div class="scr"><div class="hero"><div style="display:flex;align-items:center;gap:4px;font-size:12px">${ic('pin',12)} Ang Mo Kio</div><div style="display:flex;align-items:center;gap:10px;margin-top:4px"><span class="big">31°</span>${ic('cloud',38)}</div><div style="font-weight:600;margin-top:4px">Cloudy · till 12:30 pm</div><div style="font-size:12px">H 34° · L 25° · showers later</div></div><div class="card" data-open style="cursor:pointer"><div class="cap" style="display:flex">Rain · past 2 h<span data-clock style="margin-left:auto;text-transform:none;letter-spacing:0">10:45 am</span></div><div class="sea" style="border-radius:8px;overflow:hidden">${map('mC')}</div><div class="mut" style="font-size:11px;margin-top:5px;display:flex">Tap to open<span data-src style="margin-left:auto">Radar · RainViewer</span></div></div>${hazeChips()}${today()}${days()}</div><div class="over" data-over><div class="ab"><button data-close aria-label="Back">${ic('back',18)}</button> Rain · past 2 h</div><div style="flex:1;min-height:0;position:relative">${rainView('mC2')}</div></div>`;
hazeLayer(document.getElementById('hA'));
document.getElementById('mB').dataset.layer='rain';
root.addEventListener('click',e=>{const el=e.target.closest('[data-look],[data-play],[data-go],[data-layer],[data-close],[data-open],[data-sheet]');if(!el||!root.contains(el))return;const d=el.dataset;
 if(d.look){look=d.look;root.querySelectorAll('[data-look]').forEach(x=>x.classList.toggle('on',x===el));render()}
 else if('play' in d)play();
 else if(d.go){const ph=el.closest('.ph');ph.querySelectorAll('[data-tab]').forEach(s=>{s.hidden=s.dataset.tab!==d.go});ph.querySelectorAll('[data-go]').forEach(x=>x.classList.toggle('on',x===el))}
 else if(d.layer)setLayer(el);
 else if('close' in d)el.closest('[data-over]').classList.remove('show');
 else if('open' in d)el.closest('.ph').querySelector('[data-over]').classList.add('show');
 else if('sheet' in d)el.classList.toggle('open')});
root.addEventListener('input',e=>{if(e.target.matches('[data-scrub]')){playing=false;t=+e.target.value;render()}});
if(RM){root.querySelectorAll('[data-play]').forEach(b=>b.remove());document.getElementById('wxnote').textContent+=' Drag the bar to look back.';render()}
else{t=0;render();setTimeout(play,800)}
})();
</script>
