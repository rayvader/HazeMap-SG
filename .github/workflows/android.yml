name: Android APK

# Runs the unit tests, builds the release APK and publishes it as a GitHub
# release on every push. Pull requests only build and keep the APK as an artifact.
on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:
    inputs:
      only:
        description: "Run only one part of the emulator test. widget-fit draws the widgets at short sizes."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_SIGNING_KEY: ${{ secrets.SIGNING_KEYSTORE_B64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key
        if: env.HAS_SIGNING_KEY == 'true'
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: |
          echo "$SIGNING_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"

      - name: Unit tests and release APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: hazemap
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleRelease --no-daemon --stacktrace

      - name: Name the APK
        id: apk
        run: |
          VERSION="1.0.${{ github.run_number }}"
          FILE="HazeMapSG-${VERSION}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$FILE"
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Show signing certificate
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
          "$APKSIGNER" verify --print-certs "${{ steps.apk.outputs.file }}" | grep -i "SHA-256"

      # The same code built as version 1.0.1, so the emulator can watch it update itself to the
      # newest release. Only the smoke test uses it; it is never published.
      - name: Old copy for the self-update test
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: hazemap
        run: |
          GITHUB_RUN_NUMBER=1 ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk update-test-old.apk

      - uses: actions/upload-artifact@v4
        with:
          name: hazemap-apk
          path: |
            ${{ steps.apk.outputs.file }}
            update-test-old.apk
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7

      # Only builds from main are full releases. Branch builds are pre-releases.
      - name: Publish release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ github.ref_name != 'main' && '--prerelease' || '' }}
        run: |
          gh release create "v${{ steps.apk.outputs.version }}" "${{ steps.apk.outputs.file }}" \
            --target "${{ github.sha }}" \
            --title "Haze Map SG ${{ steps.apk.outputs.version }}" \
            --notes "Built from ${{ github.ref_name }} (${{ github.sha }}). Download the APK on your phone and open it to install." \
            $PRERELEASE

  smoke:
    # Installs the APK on an Android 14 emulator, opens every tab with live data and keeps
    # a screenshot of each as the smoke-screenshots artifact. Never blocks a release.
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # The run takes about 29 minutes with every check; the calendar line adds about 3 and the
    # widget fit pictures about 3 more.
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: hazemap-apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          SMOKE_ONLY: ${{ github.event.inputs.only }}
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_5
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash .github/scripts/smoke.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-screenshots
          path: smoke/
          if-no-files-found: ignore
          retention-days: 14
